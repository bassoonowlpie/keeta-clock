<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<title>Keeta步兵打卡器</title>
<style>
  :root {
    /* 主色：深青綠 Teal */
    --primary:#0f766e; --primary-ink:#0f766e; --primary-soft:#e3f0ee;
    /* 語義色（只保留三個：開工綠 / 收工紅 / 獎賞金） */
    --go:#15803d; --stop:#d1433f; --amber:#a86a00;
    --go-soft:#e8f4ec; --stop-soft:#fbeae9; --amber-soft:#fdf3e0;
    /* 中性面 */
    --bg:#f1f4f4; --card:#fff; --text:#16211f; --muted:#6b7f7c; --muted2:#a5b2af;
    --surface:#f2f6f5; --surface3:#e4eae8; --border:#e6ecea; --border2:#d3dbd9;
    --input-bg:#fff; --bonus-bg:#fdf3e0; --shadow:rgba(15,118,110,.10);
    --green:#15803d; --blue:#0f766e; --accent:#0f766e;   /* 舊名向後相容 */
    color-scheme:light;
  }
  body.dark {
    --primary:#14867c; --primary-ink:#5ecfbf; --primary-soft:#16302e;
    --go:#3fb950; --stop:#e0706a; --amber:#e0a339;
    --go-soft:#162a1e; --stop-soft:#2e1d1d; --amber-soft:#2e2618;
    --bg:#0e1514; --card:#161d1c; --text:#e6efed; --muted:#94a8a4; --muted2:#6b7d79;
    --surface:#1d2524; --surface3:#26302e; --border:#2a3533; --border2:#364240;
    --input-bg:#1b2221; --bonus-bg:#2e2618; --shadow:rgba(0,0,0,.45);
    --green:#3fb950; --blue:#5ecfbf; --accent:#14867c;
    color-scheme:dark;
  }
  /* 統一線條圖標 */
  .icon-sprite { position:absolute; width:0; height:0; overflow:hidden; }
  .ico { width:1.05em; height:1.05em; vertical-align:-.16em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
  .ico.solid { fill:currentColor; stroke:none; }
  .btn .ico, .btn-small .ico, .search-bar button .ico, .tab .ico { margin-right:7px; }
  .topbar { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:4px; }
  .topbar h1 { margin-bottom:0; }
  .theme-btn { width:38px; height:38px; flex-shrink:0; border:none; border-radius:10px; background:var(--surface3); color:var(--text); font-size:17px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
  .theme-btn:active { transform:scale(.92); }
  .theme-btn.spin { animation:spin .8s linear; }
  @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  .day-right { display:flex; align-items:center; gap:10px; }
  .day-add { width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; border:none; border-radius:8px; background:var(--primary-soft); color:var(--primary-ink); font-size:18px; font-weight:700; line-height:1; cursor:pointer; flex-shrink:0; }
  .day-add:active { transform:scale(.9); }
  * { margin:0; padding:0; box-sizing:border-box; font-family:"PingFang HK","Microsoft JhengHei",sans-serif; }
  body { background:var(--bg); color:var(--text); min-height:100vh; padding:16px; max-width:520px; margin:0 auto; }
  h1 { font-size:20px; text-align:center; margin-bottom:4px; color:var(--text); }
  .sub { text-align:center; color:var(--muted); font-size:13px; margin-bottom:16px; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 4px var(--shadow); }
  .status { text-align:center; padding:14px; border-radius:12px; font-size:16px; font-weight:600; margin-bottom:14px; background:var(--surface3); color:var(--muted); }
  .status.on { background:var(--primary-soft); color:var(--primary-ink); }
  .status small { display:block; font-weight:400; font-size:13px; margin-top:4px; color:var(--muted); }
  .btn { display:flex; align-items:center; justify-content:center; gap:7px; width:100%; padding:22px; font-size:22px; font-weight:700; border:none; border-radius:14px; cursor:pointer; margin-bottom:12px; transition:transform .05s; }
  .btn:active { transform:scale(.97); }
  .btn-in  { background:var(--go); color:#fff; }
  .btn-out { background:var(--stop); color:#fff; }
  .btn-in:disabled, .btn-out:disabled { background:var(--surface3); color:var(--muted2); cursor:not-allowed; }
  .btn-small { padding:10px; font-size:14px; border-radius:10px; background:var(--surface3); color:var(--text); margin-bottom:8px; }
  .btn-blue { background:var(--primary); color:#fff; }
  .btn-gray { background:var(--surface3); color:var(--muted); }
  .btn-orange { background:var(--amber); color:#fff; }
  .money-input, .cfg-input, .bonus-input { width:100%; padding:14px; font-size:16px; border:2px solid var(--border2); background:var(--input-bg); color:var(--text); border-radius:12px; margin-bottom:10px; }
  .money-input { font-size:20px; text-align:center; }
  .bonus-input { font-size:18px; text-align:center; }
  .money-input:focus { border-color:var(--primary); outline:none; }
  .bonus-input:focus { border-color:var(--amber); outline:none; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat { background:var(--surface); border-radius:10px; padding:12px; text-align:center; }
  .stat .v { font-size:20px; font-weight:700; color:var(--text); }
  .stat .l { font-size:12px; color:var(--muted); margin-top:2px; display:flex; align-items:center; justify-content:center; gap:5px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tab { flex:1; padding:10px; text-align:center; border-radius:10px; background:var(--surface3); cursor:pointer; font-size:14px; font-weight:600; color:var(--muted); border:none; }
  .tab.active { background:var(--primary); color:#fff; }
  .empty { text-align:center; color:var(--muted); padding:20px; font-size:14px; }
  .footer { text-align:center; color:var(--muted2); font-size:12px; margin-top:16px; }
  .cfg-toggle { text-align:center; color:var(--primary-ink); font-size:14px; cursor:pointer; padding:6px; }
  .sync-msg { font-size:12px; text-align:center; margin-top:8px; color:var(--muted); min-height:18px; }
  .sync-msg.ok { color:var(--go); font-weight:600; }
  .sync-msg.err { color:var(--stop); }
  .sync-msg.syncing { color:var(--primary-ink); }
  .export-row { display:flex; gap:10px; }
  .export-row .btn { margin-bottom:0; }
  .sync-row { display:flex; gap:10px; margin-top:10px; }
  .sync-row .btn { margin-bottom:0; padding:12px; font-size:14px; }
  details summary { cursor:pointer; }
  .last-sync { text-align:center; font-size:11px; color:var(--muted2); margin-top:4px; }
  .tip { font-size:11px; color:var(--muted); text-align:center; margin-top:4px; }

  /* ---------- NEW DAY CARD UI ---------- */
  .day-card { background:var(--card); border-radius:14px; margin-bottom:12px; overflow:hidden; box-shadow:0 1px 4px var(--shadow); }
  .day-card.today { border:2px solid var(--primary); }
  .day-header { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:var(--surface); border-bottom:1px solid var(--border); }
  .day-date { font-size:16px; font-weight:700; color:var(--text); }
  .day-date .wday { font-size:12px; font-weight:400; color:var(--muted); margin-left:6px; }
  .day-total { font-size:18px; font-weight:800; color:var(--go); }
  .day-body { padding:12px 16px; }
  .session-row { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:10px 0; border-bottom:1px dashed var(--border); font-size:15px; }
  .session-row:last-child { border-bottom:none; }
  .session-left { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; flex:1 1 auto; min-width:0; }
  .session-time { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; }
  .session-time .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .session-time .dot.in { background:var(--go); }
  .session-time .dot.out { background:var(--stop); }
  .session-time .time-str { font-weight:600; color:var(--text); font-size:15px; }
  .session-time .arrow { color:var(--muted2); font-size:13px; }
  .session-time .dur { color:var(--muted); font-size:12px; }
  .session-note { font-size:11px; color:var(--muted); background:var(--surface); padding:3px 8px; border-radius:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100px; flex-shrink:1; }
  .session-actions { display:flex; align-items:center; gap:8px; flex-shrink:0; margin-left:auto; }
  .session-money { font-weight:700; color:var(--go); font-size:15px; min-width:52px; text-align:right; }
  .session-cal { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:8px; background:var(--amber-soft); color:var(--amber); text-decoration:none; font-size:13px; flex-shrink:0; }
  .session-del { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:8px; background:var(--stop-soft); color:var(--stop); border:none; font-size:13px; cursor:pointer; flex-shrink:0; }
  .session-del:active { transform:scale(.9); }
  .session-edit { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:8px; background:var(--primary-soft); color:var(--primary-ink); border:none; font-size:14px; cursor:pointer; flex-shrink:0; }
  .session-edit:active { transform:scale(.9); }
  .edit-modal { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:100; }
  .edit-box { background:var(--card); border-radius:16px; padding:20px; width:90%; max-width:400px; max-height:90vh; overflow-y:auto; }
  .edit-box h3 { margin-bottom:12px; font-size:18px; color:var(--text); display:flex; align-items:center; gap:7px; }
  .edit-box input { width:100%; padding:12px; font-size:15px; border:2px solid var(--border2); background:var(--input-bg); color:var(--text); border-radius:10px; margin-bottom:10px; }
  .edit-box .edit-actions { display:flex; gap:10px; margin-top:10px; }
  .edit-box .edit-actions button { flex:1; padding:12px; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; }
  .edit-box .edit-actions .save { background:var(--primary); color:#fff; }
  .edit-box .edit-actions .cancel { background:var(--surface3); color:var(--text); }
  .note-input { width:100%; padding:12px; font-size:15px; border:2px solid var(--border2); background:var(--input-bg); color:var(--text); border-radius:12px; margin-bottom:10px; }
  .note-input:focus { border-color:var(--primary); outline:none; }
  .last-money-hint { text-align:center; font-size:13px; color:var(--primary-ink); margin-bottom:8px; min-height:18px; font-weight:600; }
  .chart-wrap { position:relative; height:260px; margin-top:16px; }
  .bonus-row2 { display:flex; align-items:center; gap:8px; padding:10px 0; background:var(--bonus-bg); margin:0 -16px; padding-left:16px; padding-right:16px; border-top:1px dashed var(--border); }
  .bonus-row2 .gift { font-size:16px; color:var(--amber); display:inline-flex; }
  .bonus-row2 .bonus-label { font-size:13px; color:var(--amber); }
  .bonus-row2 .bonus-amt { font-weight:700; color:var(--amber); font-size:15px; margin-left:auto; }
  .bonus-row2 .bonus-del { width:26px; height:26px; flex-shrink:0; border:none; border-radius:8px; background:var(--stop-soft); color:var(--stop); font-size:13px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
  .bonus-row2 .bonus-edit { color:var(--primary-ink); }
  .bonus-card .bc-edit { background:var(--card); border:none; border-radius:8px; padding:6px 12px; font-size:14px; cursor:pointer; color:var(--primary-ink); margin-left:8px; }
  .bonus-row2 .bonus-del:active { transform:scale(.9); }
  .day-actions { display:flex; gap:8px; padding:10px 16px 14px; }
  .day-actions .act-btn { flex:1; padding:10px; border-radius:10px; border:none; font-size:14px; font-weight:600; cursor:pointer; text-align:center; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .day-actions .act-btn.del { background:var(--stop-soft); color:var(--stop); }
  .day-actions .act-btn.cal { background:var(--primary-soft); color:var(--primary-ink); }
  .day-actions .act-btn.del-bonus { background:var(--amber-soft); color:var(--amber); font-size:13px; }

  /* week/month table */
  .summary-table { width:100%; border-collapse:collapse; font-size:14px; }
  .summary-table th, .summary-table td { padding:12px 8px; text-align:center; border-bottom:1px solid var(--border); }
  .summary-table th { color:var(--muted); font-weight:600; font-size:13px; background:var(--surface); }
  .summary-table td.money { color:var(--go); font-weight:700; font-size:15px; }

  /* orphan bonus cards */
  .bonus-card { background:var(--bonus-bg); border-radius:14px; padding:14px 16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .bonus-card .gift { font-size:20px; color:var(--amber); display:inline-flex; }
  .bonus-card .bc-info { flex:1; margin-left:10px; }
  .bonus-card .bc-date { font-size:14px; font-weight:600; color:var(--text); }
  .bonus-card .bc-label { font-size:12px; color:var(--amber); }
  .bonus-card .bc-amt { font-size:18px; font-weight:800; color:var(--amber); }
  .bonus-card .bc-del { background:var(--card); border:none; border-radius:8px; padding:6px 12px; font-size:14px; cursor:pointer; color:var(--stop); margin-left:8px; }

  /* search & show more */
  .search-bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:flex-end; }
  .search-field { flex:1 1 160px; min-width:0; display:flex; flex-direction:column; gap:3px; font-size:12px; font-weight:600; color:var(--muted); }
  .search-bar input { width:100%; min-width:0; height:46px; padding:0 14px; font-size:15px; border:2px solid var(--border2); background:var(--input-bg); color:var(--text); border-radius:10px; -webkit-appearance:none; appearance:none; }
  .search-bar input:focus { border-color:var(--primary); outline:none; }
  .search-bar button { height:46px; padding:0 18px; border:none; border-radius:10px; background:var(--primary); color:#fff; font-size:15px; font-weight:600; cursor:pointer; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; }
  .search-bar button.clear { background:var(--surface3); color:var(--text); }
  .show-more-btn { display:flex; align-items:center; justify-content:center; gap:7px; width:100%; padding:14px; text-align:center; background:var(--surface3); border:none; border-radius:12px; font-size:15px; font-weight:600; color:var(--text); cursor:pointer; margin-top:8px; }
  .show-more-btn:active { background:var(--border); }
</style>
</head>
<body>

  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 4v4.5H16"/></symbol>

<div class="topbar">
  <h1><svg class="ico" style="width:23px;height:23px;margin-right:7px;vertical-align:-4px"><use href="#i-scooter"/></svg>Keeta 步兵打卡器</h1>
  <button id="themeBtn" class="theme-btn" onclick="toggleTheme()" title="切換暗黑模式"><svg class="ico"><use href="#i-moon"/></svg></button>
  <button id="refreshBtn" class="theme-btn" onclick="hardRefresh()" title="重新整理（清除緩存，攞最新版本）"><svg class="ico"><use href="#i-refresh"/></svg></button>
</div>
<div class="sub">開工按綠色按鈕 ・ 收工按紅色按鈕</div>

<div class="card">
  <div id="statusBox" class="status off">未開工<small></small></div>
  <button id="btnIn" class="btn btn-in" onclick="clockIn()"><svg class="ico"><use href="#i-play"/></svg>開工打卡</button>
  <div id="lastMoneyHint" class="last-money-hint"></div>
  <input id="moneyInput" class="money-input" type="number" inputmode="decimal" min="0" step="0.1" placeholder="收工請輸入今日累計賺了多少錢（HK$）">
  <input id="noteInput" class="note-input" type="text" placeholder="備註（例如：天氣、單量、地區…）">

<script>
const KEY = 'keeta_walker_records';
const CFG = 'keeta_walker_cfg';
const DELETED_KEY = 'keeta_walker_deleted';
const BONUS_KEY = 'keeta_walker_bonuses';
let records = JSON.parse(localStorage.getItem(KEY) || '[]');
let openRec = JSON.parse(localStorage.getItem(KEY + '_open') || 'null');
let deletedIds = JSON.parse(localStorage.getItem(DELETED_KEY) || '[]');
let bonuses = JSON.parse(localStorage.getItem(BONUS_KEY) || '[]');
let cfg = JSON.parse(localStorage.getItem(CFG) || 'null');
let view = 'day';
let cloudSha = null;
let syncing = false;
let daysToShow = 5;
let searchDateVal = '';

function saveLocal() {
  localStorage.setItem(KEY, JSON.stringify(records));
  localStorage.setItem(KEY + '_open', JSON.stringify(openRec));
  localStorage.setItem(DELETED_KEY, JSON.stringify(deletedIds));
  localStorage.setItem(BONUS_KEY, JSON.stringify(bonuses));
}
function todayStr(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtTime(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function fmtDur(ms) { return (ms / 3600000).toFixed(1) + 'h'; }
function uid() { return Date.now() + '-' + Math.random().toString(36).slice(2,8); }

function msg(text, type) {
  const el = document.getElementById('syncMsg');
  el.textContent = text;
  el.className = 'sync-msg' + (type ? ' ' + type : '');
}
function bonusMsg(text, type) {
  const el = document.getElementById('bonusMsg');
  el.textContent = text;
  el.className = 'sync-msg' + (type ? ' ' + type : '');
}
function setLastSync() {
  const el = document.getElementById('lastSync');
  el.textContent = '最後同步：' + fmtTime(Date.now());
}
function getLastMoney() {
  const today = todayStr();
  const todayRecs = records.filter(r => r.date === today && r.money != null);
  return todayRecs.length ? todayRecs[todayRecs.length - 1].money : null;
}
function updateLastMoneyHint() {
  const hint = document.getElementById('lastMoneyHint');
  const last = getLastMoney();
  hint.textContent = last != null ? '上次輸入 $' + last.toFixed(1) + '（供參考）' : '';
}

/* ---------- 主題（暗黑模式） ---------- */
function applyTheme(t) {
  const dark = (t === 'dark');
  if (dark) document.body.classList.add('dark');
  else document.body.classList.remove('dark');
  const btn = document.getElementById('themeBtn');
  if (btn) btn.innerHTML = dark ? '<svg class="ico"><use href="#i-sun"/></svg>' : '<svg class="ico"><use href="#i-moon"/></svg>';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#0e1514' : '#0f766e');
  if (window.Chart) {
    const cs = getComputedStyle(document.body);
    Chart.defaults.color = cs.getPropertyValue('--muted').trim();
    Chart.defaults.borderColor = cs.getPropertyValue('--border').trim();
  }
}
function toggleTheme() {
  const next = document.body.classList.contains('dark') ? 'light' : 'dark';
  localStorage.setItem('keeta_theme', next);
  applyTheme(next);
  refresh();
}
/* 重新整理：清走 PWA 緩存再重新載入，確保攞到最新版本 */
async function hardRefresh() {
  const btn = document.getElementById('refreshBtn');
  if (btn) btn.classList.add('spin');
  try {
    if (typeof caches !== 'undefined' && caches.keys) {
      const names = await caches.keys();
      await Promise.all(names.map(n => caches.delete(n)));
    }
  } catch (e) {}
  try {
    if (typeof navigator !== 'undefined' && navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      const regs = await navigator.serviceWorker.getRegistrations();
      regs.forEach(r => { if (r.update) r.update(); });
    }
  } catch (e) {}
  setTimeout(() => { location.reload(); }, 350);
}

/* ---------- Google Calendar ---------- */
function toCalDate(ts) {
  const d = new Date(ts);
  return d.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
}
function makeCalLink(startTs, endTs, money) {
  const text = 'Keeta開工';
  const details = '當日累計收入：HK$' + (money || 0);
  const dates = toCalDate(startTs) + '/' + toCalDate(endTs);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(text) + '&details=' + encodeURIComponent(details) + '&dates=' + dates;
}

/* ---------- 每日收入計算（含獎賞） ---------- */
function getDayBonus(date) {
  return bonuses.filter(b => b.date === date).reduce((s, b) => s + b.amount, 0);
}
function dailyIncomeMap() {
  const map = {};
  records.forEach(r => { if (r.money != null) map[r.date] = r.money; });
  // 當日總收入 = 收工輸入嘅錢 + 獎賞
  bonuses.forEach(b => {
    if (map[b.date] != null) map[b.date] += b.amount;
    else map[b.date] = b.amount;
  });
  return map;
}
function sumDailyIncome(filterFn) {
  const map = dailyIncomeMap();
  let sum = 0;
  Object.keys(map).forEach(date => { if (!filterFn || filterFn(date)) sum += map[date]; });
  return sum;
}
function countWorkDays(filterFn) {
  const map = dailyIncomeMap();
  let count = 0;
  Object.keys(map).forEach(date => { if (!filterFn || filterFn(date)) count++; });
  return count;
}
function getLastRecordIdPerDay() {
  const map = {};
  records.forEach(r => { if (r.out) map[r.date] = r.id; });
  return map;
}
function sumBonuses(filterFn) {
  return bonuses.reduce((s, b) => { if (!filterFn || filterFn(b.date)) return s + b.amount; return s; }, 0);
}

/* ---------- 獎賞 ---------- */
async function addBonus() {
  const v = parseFloat(document.getElementById('bonusInput').value);
  if (isNaN(v) || v <= 0) { bonusMsg('請輸入有效獎賞金額', 'err'); return; }
  bonuses.push({ id: uid(), date: todayStr(), amount: Math.round(v * 10) / 10 });
  document.getElementById('bonusInput').value = '';
  saveLocal(); refresh();
  bonusMsg('✅ 已加入今日獎賞 HK$' + v, 'ok');
  if (cfg) await cloudSave();
}
let editingBonusId = null;
function editBonus(id) {
  const b = bonuses.find(x => x.id === id);
  if (!b) return;
  editingBonusId = id;
  const lbl = 'font-size:13px;color:var(--muted);';
  const modal = document.createElement('div');
  modal.className = 'edit-modal';
  modal.innerHTML = '<div class="edit-box">' +
    '<h3><svg class="ico"><use href="#i-pencil"/></svg>編輯獎賞</h3>' +
    '<label style="' + lbl + '">獎賞日期</label>' +
    '<input id="bonusDate" type="date" value="' + b.date + '">' +
    '<label style="' + lbl + '">金額（HK$）</label>' +
    '<input id="bonusAmt" type="number" inputmode="decimal" min="0" step="0.1" value="' + b.amount + '">' +
    '<div class="edit-actions">' +
      '<button class="save" onclick="saveBonusEdit()"><svg class="ico"><use href="#i-check"/></svg>儲存</button>' +
      '<button class="cancel" onclick="closeEdit()">取消</button>' +
    '</div>' +
  '</div>';
  document.body.appendChild(modal);
}
async function saveBonusEdit() {
  const b = bonuses.find(x => x.id === editingBonusId);
  if (!b) { closeEdit(); return; }
  const dv = document.getElementById('bonusDate').value;
  const av = document.getElementById('bonusAmt').value;
  if (!dv) { alert('日期不能為空！'); return; }
  const v = parseFloat(av);
  if (isNaN(v) || v <= 0) { alert('請輸入有效金額！'); return; }
  b.date = dv;
  b.amount = Math.round(v * 10) / 10;
  b._editedAt = Date.now();
  closeEdit();
  saveLocal(); refresh();
  if (cfg) { const ok = await cloudSave(); if (ok) msg('✅ 已更新獎賞並同步到雲端', 'ok'); else msg('✅ 已更新獎賞（雲端同步失敗）', 'err'); }
  else msg('✅ 已更新獎賞', 'ok');
}
async function delBonus(id) {
  if (!confirm('確定刪除這個獎賞？')) return;
  bonuses = bonuses.filter(b => b.id !== id);
  if (!deletedIds.includes(id)) deletedIds.push(id);
  saveLocal(); refresh();
  if (cfg) { const ok = await cloudSave(); if (ok) msg('🗑 已刪除獎賞並同步到雲端', 'ok'); else msg('🗑 已刪除獎賞（雲端同步失敗）', 'err'); }
  else msg('🗑 已刪除獎賞', 'ok');
}

/* ---------- GitHub 雲端同步 ---------- */
function ghHeaders() {
  return { 'Authorization': 'token ' + cfg.token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
}
function mergeRecords(localRecs, cloudRecs) {
  const map = {};
  (localRecs || []).forEach(r => { if (!deletedIds.includes(r.id)) map[r.id] = r; });
  (cloudRecs || []).forEach(r => {
    if (deletedIds.includes(r.id)) return;
    if (!map[r.id]) map[r.id] = r;
    else {
      const local = map[r.id];
      const localEdit = local._editedAt || 0;
      const cloudEdit = r._editedAt || 0;
      if (cloudEdit > localEdit) map[r.id] = r;
      else if (cloudEdit === localEdit && (r.out||r.in) > (local.out||local.in)) map[r.id] = r;
    }
  });
  return Object.values(map).sort((a,b) => a.in - b.in);
}
function mergeBonuses(localBonuses, cloudBonuses) {
  const map = {};
  (localBonuses || []).forEach(b => { if (!deletedIds.includes(b.id)) map[b.id] = b; });
  (cloudBonuses || []).forEach(b => {
    if (deletedIds.includes(b.id)) return;
    if (!map[b.id]) map[b.id] = b;
    else {
      const local = map[b.id];
      const localEdit = local._editedAt || 0;
      const cloudEdit = b._editedAt || 0;
      if (cloudEdit > localEdit) map[b.id] = b;
    }
  });
  return Object.values(map);
}

async function cloudLoad() {
  if (!cfg) return;
  try {
    msg('📥 正在從雲端下載…', 'syncing');
    const r = await fetch('https://api.github.com/repos/' + cfg.user + '/' + cfg.repo + '/contents/data.json', { headers: ghHeaders() });
    if (r.status === 404) { cloudSha = null; msg('☁️ 雲端未有資料，將會新建'); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    cloudSha = j.sha;
    const cloudData = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
    (cloudData.deletedIds || []).forEach(id => { if (!deletedIds.includes(id)) deletedIds.push(id); });
    records = mergeRecords(records, cloudData.records);
    bonuses = mergeBonuses(bonuses, cloudData.bonuses);
    if (cloudData.openRec && !deletedIds.includes(cloudData.openRec.id)) {
      if (!openRec || cloudData.openRec.in > openRec.in) openRec = cloudData.openRec;
    } else if (openRec && records.some(r => r.id === openRec.id)) {
      // 雲端已冇開工中記錄，而本機嗰個時段已經出現喺記錄入面（即已收工）→ 清除開工中狀態
      openRec = null;
    }
    saveLocal(); refresh();
    msg('✅ 已從雲端同步 ' + records.length + ' 條記錄', 'ok');
    setLastSync();
  } catch (e) { msg('⚠️ 下載失敗：' + e.message, 'err'); }
}

async function cloudSave() {
  if (!cfg) { msg('未設定 GitHub（只用本機模式）'); return false; }
  if (syncing) return false;
  syncing = true;
  try {
    msg('☁️ 正在同步上雲端…', 'syncing');
    const r = await fetch('https://api.github.com/repos/' + cfg.user + '/' + cfg.repo + '/contents/data.json', { headers: ghHeaders() });
    if (r.ok) {
      const j = await r.json(); cloudSha = j.sha;
      const cd = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
      (cd.deletedIds || []).forEach(id => { if (!deletedIds.includes(id)) deletedIds.push(id); });
      records = mergeRecords(records, cd.records);
      bonuses = mergeBonuses(bonuses, cd.bonuses);
    } else { cloudSha = null; }
    const payload = JSON.stringify({ records, openRec, deletedIds, bonuses });
    const body = { message: 'update clock records ' + todayStr() + ' ' + fmtTime(Date.now()), content: btoa(unescape(encodeURIComponent(payload))) };
    if (cloudSha) body.sha = cloudSha;
    const w = await fetch('https://api.github.com/repos/' + cfg.user + '/' + cfg.repo + '/contents/data.json', {
      method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body)
    });
    if (!w.ok) { const err = await w.json().catch(() => ({})); throw new Error(err.message || 'HTTP ' + w.status); }
    const wj = await w.json();
    cloudSha = wj.content.sha;
    msg('✅ 已同步到 GitHub ☁️', 'ok');
    setLastSync(); saveLocal(); refresh();
    return true;
  } catch (e) { msg('⚠️ 同步失敗（已保留在本機）：' + e.message, 'err'); return false; }
  finally { syncing = false; }
}

async function forceSync() { if (!cfg) { alert('請先在下面設定 GitHub Token'); return; } await cloudSave(); }
async function syncFromCloud() { if (!cfg) { alert('請先在下面設定 GitHub Token'); return; } await cloudLoad(); }

function saveConfig() {
  const user = document.getElementById('cfgUser').value.trim();
  const repo = document.getElementById('cfgRepo').value.trim();
  const token = document.getElementById('cfgToken').value.trim();
  if (!user || !repo || !token) { alert('三項都要填！'); return; }
  cfg = { user, repo, token };
  localStorage.setItem(CFG, JSON.stringify(cfg));
  msg(''); cloudLoad().then(() => cloudSave());
}
function clearConfig() {
  cfg = null; cloudSha = null; deletedIds = []; bonuses = [];
  localStorage.removeItem(CFG); localStorage.removeItem(DELETED_KEY); localStorage.removeItem(BONUS_KEY);
  document.getElementById('cfgUser').value = '';
  document.getElementById('cfgRepo').value = '';
  document.getElementById('cfgToken').value = '';
  msg('已清除雲端設定，只用本機模式');
  document.getElementById('lastSync').textContent = '';
}

/* ---------- 打卡 ---------- */
async function clockIn() {
  if (openRec) { alert('已經開工了！'); return; }
  openRec = { id: uid(), date: todayStr(), in: Date.now(), out: null, money: null, note: '' };
  updateLastMoneyHint();
  saveLocal(); refresh();
  if (cfg) {
    const ok = await cloudSave();
    if (ok) alert('✅ 開工打卡成功！已同步到雲端\n' + fmtTime(openRec.in));
    else alert('✅ 開工打卡成功！（雲端同步失敗，已保留在本機）\n' + fmtTime(openRec.in));
  } else alert('✅ 開工打卡成功！' + fmtTime(openRec.in));
}

async function clockOut() {
  if (!openRec) { alert('還未開工！'); return; }
  const v = parseFloat(document.getElementById('moneyInput').value);
  if (isNaN(v) || v < 0) { alert('請輸入今日累計賺了多少錢！'); return; }
  openRec.out = Date.now();
  openRec.money = Math.round(v * 10) / 10;
  openRec.note = document.getElementById('noteInput').value.trim();
  records.push(openRec);
  openRec = null;
  document.getElementById('moneyInput').value = '';
  document.getElementById('noteInput').value = '';
  saveLocal(); refresh();
  if (cfg) {
    const ok = await cloudSave();
    if (ok) alert('✅ 收工打卡成功！已同步到雲端\n今日累計賺了 HK$' + v);
    else alert('✅ 收工打卡成功！（雲端同步失敗，已保留在本機）\n今日累計賺了 HK$' + v);
  } else alert('✅ 收工打卡成功！今日累計賺了 HK$' + v);
}

async function delRec(i) {
  if (!confirm('確定刪除這條記錄？')) return;
  const id = records[i].id;
  records.splice(i, 1);
  if (!deletedIds.includes(id)) deletedIds.push(id);
  saveLocal(); refresh();
  if (cfg) { const ok = await cloudSave(); if (ok) msg('🗑 已刪除並同步到雲端', 'ok'); else msg('🗑 已刪除（雲端同步失敗）', 'err'); }
  else msg('🗑 已刪除', 'ok');
}

let editIdx = null;   // null = 新增模式

function openSessionModal(i, defDate) {
  editIdx = (i === null || i === undefined) ? null : i;
  const isNew = editIdx === null;
  const r = isNew
    ? { date: defDate || todayStr(), in: null, out: null, money: null, note: '' }
    : records[i];
  const inStr = isNew ? '' : fmtTime(r.in);
  const outStr = (isNew || !r.out) ? '' : fmtTime(r.out);

  const lbl = 'font-size:13px;color:var(--muted);';
  const modal = document.createElement('div');
  modal.className = 'edit-modal';
  modal.innerHTML = '<div class="edit-box">' +
    '<h3>' + (isNew ? '<svg class="ico"><use href="#i-plus"/></svg>新增工作時段' : '<svg class="ico"><use href="#i-pencil"/></svg>編輯打卡記錄') + '</h3>' +
    '<label style="' + lbl + '">工作日期</label>' +
    '<input id="editDate" type="date" value="' + (r.date || todayStr()) + '">' +
    '<label style="' + lbl + '">開工時間</label>' +
    '<input id="editIn" type="time" value="' + inStr + '">' +
    '<label style="' + lbl + '">收工時間（留空表示未收工）</label>' +
    '<input id="editOut" type="time" value="' + outStr + '">' +
    '<label style="' + lbl + '">收入金額（留空 = 唔改當日總收入）</label>' +
    '<input id="editMoney" type="number" inputmode="decimal" min="0" step="0.1" value="' + (r.money != null ? r.money : '') + '">' +
    '<label style="' + lbl + '">備註</label>' +
    '<input id="editNote" type="text" value="' + (r.note || '') + '">' +
    '<div class="edit-actions">' +
      '<button class="save" onclick="saveSession()"><svg class="ico"><use href="#i-check"/></svg>儲存</button>' +
      '<button class="cancel" onclick="closeEdit()">取消</button>' +
    '</div>' +
  '</div>';
  document.body.appendChild(modal);
}
function editRec(i) { openSessionModal(i); }
function addRec(date) { openSessionModal(null, date); }

function closeEdit() {
  const modal = document.querySelector('.edit-modal');
  if (modal) modal.remove();
}

async function saveSession() {
  const dateVal = document.getElementById('editDate').value;
  const inVal = document.getElementById('editIn').value;
  const outVal = document.getElementById('editOut').value;
  const moneyVal = document.getElementById('editMoney').value;
  const noteVal = document.getElementById('editNote').value;

  if (!dateVal) { alert('工作日期不能為空！'); return; }
  if (!inVal) { alert('開工時間不能為空！'); return; }

  const [y, m, d] = dateVal.split('-').map(Number);
  const [inH, inM] = inVal.split(':').map(Number);
  const inTs = new Date(y, m - 1, d, inH, inM, 0, 0).getTime();

  let outTs = null;
  if (outVal) {
    const [outH, outM] = outVal.split(':').map(Number);
    // 編輯時保留原本跨午夜（23:00 → 02:00）；新增時收工早過開工即當跨日
    let offset = 0;
    if (editIdx !== null && records[editIdx].out) {
      const old = records[editIdx];
      const dayStart = dd => new Date(dd.getFullYear(), dd.getMonth(), dd.getDate()).getTime();
      offset = Math.round((dayStart(new Date(old.out)) - dayStart(new Date(old.in))) / 86400000);
    }
    const outDate = new Date(y, m - 1, d + offset, outH, outM, 0, 0);
    if (outDate.getTime() <= inTs) outDate.setDate(outDate.getDate() + 1);
    outTs = outDate.getTime();
  }

  const money = moneyVal !== '' ? Math.round(parseFloat(moneyVal) * 10) / 10 : null;
  const isNew = editIdx === null;

  if (isNew) {
    records.push({ id: uid(), date: dateVal, in: inTs, out: outTs, money: money, note: noteVal.trim(), _editedAt: Date.now() });
  } else {
    const r = records[editIdx];
    r.date = dateVal; r.in = inTs; r.out = outTs; r.money = money;
    r.note = noteVal.trim(); r._editedAt = Date.now();
  }

  closeEdit();
  saveLocal(); refresh();
  const done = isNew ? '✅ 已新增時段' : '✅ 已儲存';
  if (cfg) { const ok = await cloudSave(); if (ok) msg(done + '並同步到雲端', 'ok'); else msg(done + '（雲端同步失敗）', 'err'); }
  else msg(done, 'ok');
}

/* ---------- 導出 ---------- */
function download(name, content, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}
function exportCSV() {
  if (!records.length && !bonuses.length) { alert('還沒有記錄！'); return; }
  const incMap = dailyIncomeMap();
  let csv = '\ufeff日期,開工時間,收工時間,工作時數,當日總收入HK$,備註,時段備註\r\n';
  records.forEach(r => {
    const lastIds = getLastRecordIdPerDay();
    const isLastOfDay = lastIds[r.date] === r.id;
    const note = isLastOfDay ? '當日最後收工' : '';
    csv += [r.date, fmtTime(r.in), r.out ? fmtTime(r.out) : '', r.out ? ((r.out-r.in)/3600000).toFixed(2) : '', r.money, note, r.note || ''].join(',') + '\r\n';
  });
  if (bonuses.length) {
    csv += '\r\n獎賞記錄\r\n日期,金額\r\n';
    bonuses.forEach(b => {
      csv += [b.date, b.amount].join(',') + '\r\n';
    });
  }
  download('keeta_' + todayStr().replace(/-/g,'') + '.csv', csv, 'text/csv;charset=utf-8');
}
function exportJSON() {
  if (!records.length && !bonuses.length) { alert('還沒有記錄！'); return; }
  download('keeta_' + todayStr().replace(/-/g,'') + '.json', JSON.stringify({ records, bonuses }, null, 2), 'application/json');
}

/* ---------- 顯示 ---------- */
function wday(d) {
  const arr = ['日','一','二','三','四','五','六'];
  return arr[new Date(d).getDay()];
}
function switchTab(v, el) {
  view = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const searchBar = document.getElementById('searchBar');
  if (view === 'day') searchBar.style.display = 'flex';
  else searchBar.style.display = 'none';
  renderRecords();
}
function doSearch() {
  searchDateVal = document.getElementById('searchDate').value || '';
  daysToShow = 5;
  renderRecords();
}
function clearSearch() {
  document.getElementById('searchDate').value = '';
  searchDateVal = '';
  daysToShow = 5;
  renderRecords();
}
function showMore() {
  daysToShow += 5;
  renderRecords();
}
function buildBonusCard(b) {
  return '<div class="bonus-card">' +
    '<span class="gift"><svg class="ico"><use href="#i-gift"/></svg></span>' +
    '<div class="bc-info">' +
      '<div class="bc-date">' + b.date + ' 星期' + wday(b.date) + '</div>' +
      '<div class="bc-label">獎賞</div>' +
    '</div>' +
    '<div class="bc-amt">$' + b.amount.toFixed(1) + '</div>' +
    '<button class="bc-edit" onclick="editBonus(\'' + b.id + '\')" title="編輯獎賞日子／金額"><svg class="ico"><use href="#i-pencil"/></svg></button>' +
    '<button class="bc-del" onclick="delBonus(\'' + b.id + '\')" title="刪除"><svg class="ico"><use href="#i-x"/></svg></button>' +
  '</div>';
}
function buildDayCard(date, dayRecs, dayIdxs, isSearchResult) {
  const lastRec = dayRecs[dayRecs.length - 1];
  const dayBonusAmt = getDayBonus(date);
  const today = todayStr();
  const isToday = date === today;

  let sessionsHtml = '';
  dayRecs.forEach((r, i) => {
    const idx = dayIdxs[i];
    const dur = r.out ? fmtDur(r.out - r.in) : '-';
    const calLink = r.out ? '<a class="session-cal" href="' + makeCalLink(r.in, r.out, r.money) + '" target="_blank" title="加入行事曆"><svg class="ico"><use href="#i-calendar"/></svg></a>' : '';
    const delBtn = '<button class="session-del" onclick="delRec(' + idx + ')" title="刪除"><svg class="ico"><use href="#i-x"/></svg></button>';
    const editBtn = '<button class="session-edit" onclick="editRec(' + idx + ')" title="編輯"><svg class="ico"><use href="#i-pencil"/></svg></button>';
    const noteBadge = r.note ? '<span class="session-note">' + r.note + '</span>' : '';
    sessionsHtml += '<div class="session-row">' +
      '<div class="session-left">' +
        '<div class="session-time">' +
          '<span class="dot in"></span>' +
          '<span class="time-str">' + fmtTime(r.in) + '</span>' +
          '<span class="arrow"><svg class="ico"><use href="#i-arrow"/></svg></span>' +
          '<span class="time-str">' + (r.out ? fmtTime(r.out) : '--:--') + '</span>' +
          '<span class="dur">(' + dur + ')</span>' +
        '</div>' +
        noteBadge +
      '</div>' +
      '<div class="session-actions">' +
        (r.money != null ? '<span class="session-money">$' + r.money.toFixed(1) + '</span>' : '') +
        calLink +
        editBtn +
        delBtn +
      '</div>' +
    '</div>';
  });

  let bonusHtml = '';
  const dayBonuses = bonuses.filter(b => b.date === date);
  dayBonuses.forEach(b => {
    bonusHtml += '<div class="bonus-row2">' +
      '<span class="gift"><svg class="ico"><use href="#i-gift"/></svg></span>' +
      '<span class="bonus-label">獎賞</span>' +
      '<span class="bonus-amt">$' + b.amount.toFixed(1) + '</span>' +
      '<button class="bonus-del bonus-edit" onclick="editBonus(\'' + b.id + '\')" title="編輯呢筆獎賞"><svg class="ico"><use href="#i-pencil"/></svg></button>' +
      '<button class="bonus-del" onclick="delBonus(\'' + b.id + '\')" title="刪除呢筆獎賞"><svg class="ico"><use href="#i-x"/></svg></button>' +
    '</div>';
  });

  const totalMoney = (lastRec.money || 0) + dayBonusAmt;

  return '<div class="day-card ' + (isToday ? 'today' : '') + '">' +
    '<div class="day-header">' +
      '<div class="day-date">' + date + '<span class="wday">星期' + wday(date) + '</span></div>' +
      '<div class="day-right">' +
        '<div class="day-total">$' + totalMoney.toFixed(1) + '</div>' +
        '<button class="day-add" onclick="addRec(\'' + date + '\')" title="手動新增呢日嘅工作時段"><svg class="ico"><use href="#i-plus"/></svg></button>' +
      '</div>' +
    '</div>' +
    '<div class="day-body">' + sessionsHtml + '</div>' +
    (bonusHtml || '') +
    '<div class="day-actions">' +
      '<button class="act-btn del" onclick="if(confirm(\'確定刪除這天的所有記錄？\')){[' + dayIdxs.join(',') + '].reverse().forEach(i=>delRec(i))}"><svg class="ico"><use href="#i-trash"/></svg>刪除當日全部</button>' +
    '</div>' +
  '</div>';
}
function renderRecords() {
  const box = document.getElementById('recordBox');
  if (!records.length && !bonuses.length) { box.innerHTML = '<div class="empty">還沒有記錄，快開工打卡吧！</div>'; return; }

  if (view === 'day') {
    // Group records by date
    const dayMap = {};
    records.forEach((r, idx) => {
      if (!dayMap[r.date]) dayMap[r.date] = { records: [], indices: [] };
      dayMap[r.date].records.push(r);
      dayMap[r.date].indices.push(idx);
    });

    // Sort dates descending
    const allDates = Object.keys(dayMap).sort().reverse();
    const today = todayStr();
    let html = '';
    let displayDates = [];

    if (searchDateVal) {
      const hasBonus = bonuses.some(b => b.date === searchDateVal);
      if (dayMap[searchDateVal]) {
        displayDates = [searchDateVal];
      } else if (!hasBonus) {
        box.innerHTML = '<div class="empty"><svg class="ico"><use href="#i-search"/></svg>搵唔到 ' + searchDateVal + ' 嘅記錄</div>';
        return;
      }
    } else {
      displayDates = allDates.slice(0, daysToShow);
    }

    // 組合 day cards 同孤立獎賞卡，一齊按日期排（最新喺頂）
    const items = [];
    displayDates.forEach(date => {
      const day = dayMap[date];
      items.push({ date: date, html: buildDayCard(date, day.records, day.indices, !!searchDateVal) });
    });

    // 孤立獎賞（嗰日仲未開工，或者冇開工記錄嘅獎賞）
    const workDates = new Set(allDates);
    bonuses.filter(b => !workDates.has(b.date)).forEach(b => {
      const show = searchDateVal ? (b.date === searchDateVal)
                 : (allDates.indexOf(b.date) < daysToShow);
      if (show) items.push({ date: b.date, html: buildBonusCard(b) });
    });

    items.sort((a, b) => b.date.localeCompare(a.date));
    items.forEach(it => { html += it.html; });

    // Show more button
    if (!searchDateVal && allDates.length > daysToShow) {
      const remaining = allDates.length - daysToShow;
      html += '<button class="show-more-btn" onclick="showMore()"><svg class="ico"><use href="#i-chevron"/></svg>顯示更多 (' + remaining + ' 天)</button>';
    }

    box.innerHTML = html;

  } else {
    // week/month summary table
    const groups = {};
    records.forEach(r => {
      const d = new Date(r.in);
      let k;
      if (view === 'week') {
        const onejan = new Date(d.getFullYear(),0,1);
        const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
        k = d.getFullYear() + ' 第' + week + '週';
      } else {
        k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      }
      if (!groups[k]) groups[k] = { money:0, hours:0, days: new Set() };
      groups[k].days.add(r.date);
      if (r.out) groups[k].hours += (r.out - r.in) / 3600000;
    });
    const dayMap2 = dailyIncomeMap();
    Object.keys(dayMap2).forEach(date => {
      const d = new Date(date);
      let k;
      if (view === 'week') {
        const onejan = new Date(d.getFullYear(),0,1);
        const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
        k = d.getFullYear() + ' 第' + week + '週';
      } else {
        k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      }
      if (groups[k]) groups[k].money += dayMap2[date];
    });
    let html = '<table class="summary-table"><tr><th>期間</th><th>日數</th><th>時數</th><th>收入</th></tr>';
    Object.keys(groups).sort().reverse().forEach(k => {
      const g = groups[k];
      html += '<tr><td>' + k + '</td><td>' + g.days.size + '日</td><td>' + g.hours.toFixed(1) + 'h</td><td class="money">$' + g.money.toFixed(1) + '</td></tr>';
    });
    html += '</table>';
    if (view === 'month') {
      html += '<div class="chart-wrap"><canvas id="monthChart"></canvas></div>';
      box.innerHTML = html;
      renderMonthChart(groups);
    } else {
      box.innerHTML = html;
    }
  }
}
function renderMonthChart(groups) {
  const canvas = document.getElementById('monthChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const labels = Object.keys(groups).sort().reverse().slice(0, 6).reverse();
  const data = labels.map(k => groups[k].money);
  if (window._monthChart) window._monthChart.destroy();
  window._monthChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: '收入 HK$',
        data: data,
        backgroundColor: 'rgba(39, 174, 96, 0.6)',
        borderColor: '#0f766e',
        borderWidth: 1,
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, ticks: { callback: function(v) { return '$' + v; } } }
      }
    }
  });
}
function refresh() {
  const st = document.getElementById('statusBox');
  const btnIn = document.getElementById('btnIn');
  const btnOut = document.getElementById('btnOut');
  if (openRec) {
    updateLastMoneyHint();
    st.className = 'status on';
    st.innerHTML = '<svg class="ico"><use href="#i-check"/></svg>開工中<small>' + openRec.date + ' ' + fmtTime(openRec.in) + ' 開工</small>';
    btnIn.disabled = true; btnOut.disabled = false;
  } else {
    st.className = 'status off';
    st.innerHTML = '<svg class="ico"><use href="#i-stop"/></svg>未開工<small></small>';
    btnIn.disabled = false; btnOut.disabled = true;
    document.getElementById('lastMoneyHint').textContent = '';
  }
  const hours = records.reduce((s,r) => s + (r.out ? (r.out - r.in) : 0), 0) / 3600000;
  const total = sumDailyIncome();
  const now = new Date();
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - ((now.getDay()+6)%7)); weekStart.setHours(0,0,0,0);
  const monthStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  const totalDays = countWorkDays();
  const weekIncome = sumDailyIncome(d => new Date(d) >= weekStart);
  const monthIncome = sumDailyIncome(d => d.startsWith(monthStr));
  const totalBonus = sumBonuses();
  const weekBonus = sumBonuses(d => new Date(d) >= weekStart);
  document.getElementById('stTotal').textContent = '$' + total.toFixed(1);
  document.getElementById('stDays').textContent = totalDays + '日';
  document.getElementById('stAvg').textContent = '$' + (totalDays ? (total/totalDays).toFixed(1) : 0);
  document.getElementById('stHours').textContent = hours.toFixed(1) + '小時';
  document.getElementById('stWeek').textContent = '$' + weekIncome.toFixed(1);
  document.getElementById('stMonth').textContent = '$' + monthIncome.toFixed(1);
  document.getElementById('stBonus').textContent = '$' + totalBonus.toFixed(1);
  document.getElementById('stWeekBonus').textContent = '$' + weekBonus.toFixed(1);
  renderRecords();
}

/* ---------- 背景自動同步 ---------- */
setInterval(() => { if (cfg && !syncing && !openRec) cloudSave(); }, 60000);
if (document.visibilityState !== undefined) {
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && cfg) { cloudLoad().then(() => { if (!openRec) cloudSave(); }); }
  });
}

/* ---------- PWA ---------- */
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'block';
});
function installPWA() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const newSw = reg.installing;
      if (!newSw) return;
      newSw.addEventListener('statechange', () => {
        if (newSw.state === 'installed' && navigator.serviceWorker.controller) {
          newSw.postMessage({ type: 'SKIP_WAITING' });
        }
      });
    });
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  }).catch(() => {});
}

applyTheme(localStorage.getItem('keeta_theme') || 'light');
if (cfg) {
  document.getElementById('cfgUser').value = cfg.user;
  document.getElementById('cfgRepo').value = cfg.repo;
  document.getElementById('cfgToken').value = cfg.token;
  cloudLoad().then(() => { if (!openRec) cloudSave(); });
}
refresh();
