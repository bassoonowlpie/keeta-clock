<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Keeta步兵打卡器</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"PingFang HK","Microsoft JhengHei",sans-serif; }
  body { background:#f4f5f7; min-height:100vh; padding:16px; max-width:520px; margin:0 auto; }
  h1 { font-size:20px; text-align:center; margin-bottom:4px; color:#222; }
  .sub { text-align:center; color:#888; font-size:13px; margin-bottom:16px; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .status { text-align:center; padding:14px; border-radius:12px; font-size:16px; font-weight:600; margin-bottom:14px; }
  .status.off { background:#ffecec; color:#c0392b; }
  .status.on  { background:#e8f8ef; color:#1e8449; }
  .status small { display:block; font-weight:400; font-size:13px; margin-top:4px; color:#666; }
  .btn { display:block; width:100%; padding:22px; font-size:22px; font-weight:700; border:none; border-radius:14px; cursor:pointer; margin-bottom:12px; transition:transform .05s; }
  .btn:active { transform:scale(.97); }
  .btn-in  { background:#27ae60; color:#fff; }
  .btn-in:disabled { background:#b8c4bc; cursor:not-allowed; }
  .btn-out { background:#e74c3c; color:#fff; }
  .btn-out:disabled { background:#d8b0aa; cursor:not-allowed; }
  .btn-small { padding:10px; font-size:14px; border-radius:10px; background:#2c3e50; color:#fff; margin-bottom:8px; }
  .btn-gray { background:#7f8c8d; }
  .btn-blue { background:#2980b9; }
  .btn-orange { background:#e67e22; }
  .money-input, .cfg-input, .bonus-input { width:100%; padding:14px; font-size:16px; border:2px solid #ddd; border-radius:12px; margin-bottom:10px; }
  .money-input { border-color:#e74c3c; font-size:20px; text-align:center; }
  .bonus-input { border-color:#e67e22; font-size:18px; text-align:center; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat { background:#f8f9fa; border-radius:10px; padding:12px; text-align:center; }
  .stat .v { font-size:20px; font-weight:700; color:#222; }
  .stat .l { font-size:12px; color:#888; margin-top:2px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tab { flex:1; padding:10px; text-align:center; border-radius:10px; background:#eee; cursor:pointer; font-size:14px; font-weight:600; color:#777; border:none; }
  .tab.active { background:#2c3e50; color:#fff; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:8px 4px; text-align:center; border-bottom:1px solid #eee; }
  th { color:#888; font-weight:600; font-size:12px; }
  td.money { color:#1e8449; font-weight:700; }
  td.money-sub { color:#bbb; font-size:11px; }
  .del { color:#ccc; cursor:pointer; font-size:15px; }
  .empty { text-align:center; color:#aaa; padding:20px; font-size:14px; }
  .footer { text-align:center; color:#bbb; font-size:12px; margin-top:16px; }
  .cfg-toggle { text-align:center; color:#3498db; font-size:14px; cursor:pointer; padding:6px; }
  .sync-msg { font-size:12px; text-align:center; margin-top:8px; color:#888; min-height:18px; }
  .sync-msg.ok { color:#27ae60; font-weight:600; }
  .sync-msg.err { color:#e74c3c; }
  .sync-msg.syncing { color:#2980b9; }
  .export-row { display:flex; gap:10px; }
  .export-row .btn { margin-bottom:0; }
  .sync-row { display:flex; gap:10px; margin-top:10px; }
  .sync-row .btn { margin-bottom:0; padding:12px; font-size:14px; }
  details summary { cursor:pointer; }
  .last-sync { text-align:center; font-size:11px; color:#bbb; margin-top:4px; }
  .tip { font-size:11px; color:#999; text-align:center; margin-top:4px; }
  .cal-btn { display:inline-block; background:#e67e22; color:#fff; border-radius:6px; padding:3px 8px; font-size:12px; text-decoration:none; margin-left:4px; }
  .cal-btn:active { background:#d35400; }
  .action-btns { white-space:nowrap; }
  .row-highlight { background:#e8f8ef !important; }
  .bonus-row { background:#fff8e1 !important; }
  .bonus-row td.money { color:#e67e22; }
</style>
</head>
<body>

<h1>🛵 Keeta 步兵打卡器</h1>
<div class="sub">开工按绿色按钮 ・ 收工按红色按钮</div>

<div class="card">
  <div id="statusBox" class="status off">未开工<small></small></div>
  <button id="btnIn" class="btn btn-in" onclick="clockIn()">📍 开工打卡</button>
  <input id="moneyInput" class="money-input" type="number" inputmode="decimal" min="0" step="0.1" placeholder="收工请输入今日累计赚了多少钱（HK$）">
  <button id="btnOut" class="btn btn-out" onclick="clockOut()" disabled>🏁 收工打卡</button>
  <div id="syncMsg" class="sync-msg"></div>
  <div class="sync-row">
    <button class="btn btn-small btn-blue" onclick="forceSync()">☁️ 立即同步</button>
    <button class="btn btn-small btn-gray" onclick="syncFromCloud()">📥 从云端下载</button>
  </div>
  <div id="lastSync" class="last-sync"></div>
  <div class="tip">💡 一天可多次打卡，收工输入当天累计总收入</div>
</div>

<div class="card">
  <input id="bonusInput" class="bonus-input" type="number" inputmode="decimal" min="0" step="0.1" placeholder="输入今日奖赏金额（HK$）">
  <button class="btn btn-small btn-orange" onclick="addBonus()">🎁 加入今日奖赏</button>
  <div id="bonusMsg" class="sync-msg"></div>
</div>

<div class="card">
  <div class="stats">
    <div class="stat"><div class="v" id="stTotal">$0</div><div class="l">💰 累计收入</div></div>
    <div class="stat"><div class="v" id="stDays">0日</div><div class="l">📅 开工日数</div></div>
    <div class="stat"><div class="v" id="stAvg">$0</div><div class="l">📊 平均每日</div></div>
    <div class="stat"><div class="v" id="stHours">0小時</div><div class="l">⏱ 累计时数</div></div>
    <div class="stat"><div class="v" id="stWeek">$0</div><div class="l">🗓 本星期</div></div>
    <div class="stat"><div class="v" id="stMonth">$0</div><div class="l">🗓 本月份</div></div>
    <div class="stat"><div class="v" id="stBonus">$0</div><div class="l">🎁 累计奖赏</div></div>
    <div class="stat"><div class="v" id="stWeekBonus">$0</div><div class="l">🎁 本星期奖赏</div></div>
  </div>
</div>

<div class="card">
  <div class="export-row">
    <button class="btn btn-small" onclick="exportCSV()">📄 导出 CSV</button>
    <button class="btn btn-small btn-gray" onclick="exportJSON()">📄 导出 JSON</button>
  </div>
</div>

<div class="card">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('day',this)">日</button>
    <button class="tab" onclick="switchTab('week',this)">星期</button>
    <button class="tab" onclick="switchTab('month',this)">月份</button>
  </div>
  <div id="recordBox"></div>
</div>

<div class="card">
  <details>
    <summary class="cfg-toggle">⚙️ GitHub 云端同步设定（手机电脑共用资料）</summary>
    <div style="margin-top:12px">
      <input id="cfgUser" class="cfg-input" placeholder="GitHub 用户名">
      <input id="cfgRepo" class="cfg-input" placeholder="Repository 名称（例如 keeta-clock）">
      <input id="cfgToken" class="cfg-input" type="password" placeholder="Personal Access Token">
      <button class="btn btn-small" onclick="saveConfig()">💾 储存设定并同步</button>
      <button class="btn btn-small btn-gray" onclick="clearConfig()">清除云端设定</button>
      <div class="sync-msg">Token 只储存在你的机器，不会上传。教学见安装步骤。</div>
    </div>
  </details>
</div>

<div class="footer">资料本地备份 + GitHub 云端同步 ☁️</div>

<script>
const KEY = 'keeta_walker_records';
const CFG = 'keeta_walker_cfg';
const DELETED_KEY = 'keeta_walker_deleted';
const BONUS_KEY = 'keeta_walker_bonuses';
let records = JSON.parse(localStorage.getItem(KEY) || '[]');
let openRec = JSON.parse(localStorage.getItem(KEY + '_open') || 'null');
let deletedIds = JSON.parse(localStorage.getItem(DELETED_KEY) || '[]');
let bonuses = JSON.parse(localStorage.getItem(BONUS_KEY) || '[]');
let cfg = JSON.parse(localStorage.getItem(CFG) || 'null');
let view = 'day';
let cloudSha = null;
let syncing = false;

function saveLocal() {
  localStorage.setItem(KEY, JSON.stringify(records));
  localStorage.setItem(KEY + '_open', JSON.stringify(openRec));
  localStorage.setItem(DELETED_KEY, JSON.stringify(deletedIds));
  localStorage.setItem(BONUS_KEY, JSON.stringify(bonuses));
}
function todayStr(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtTime(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function fmtDur(ms) { return (ms / 3600000).toFixed(1) + 'h'; }
function uid() { return Date.now() + '-' + Math.random().toString(36).slice(2,8); }

function msg(text, type) {
  const el = document.getElementById('syncMsg');
  el.textContent = text;
  el.className = 'sync-msg' + (type ? ' ' + type : '');
}
function bonusMsg(text, type) {
  const el = document.getElementById('bonusMsg');
  el.textContent = text;
  el.className = 'sync-msg' + (type ? ' ' + type : '');
}
function setLastSync() {
  const el = document.getElementById('lastSync');
  el.textContent = '最後同步：' + fmtTime(Date.now());
}

/* ---------- Google Calendar ---------- */
function toCalDate(ts) {
  const d = new Date(ts);
  return d.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
}
function makeCalLink(startTs, endTs, money) {
  const text = 'Keeta开工';
  const details = '当日累计收入：HK$' + (money || 0);
  const dates = toCalDate(startTs) + '/' + toCalDate(endTs);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(text) + '&details=' + encodeURIComponent(details) + '&dates=' + dates;
}

/* ---------- 每日收入计算（含奖赏） ---------- */
function getDayBonus(date) {
  return bonuses.filter(b => b.date === date).reduce((s, b) => s + b.amount, 0);
}
function dailyIncomeMap() {
  const map = {};
  records.forEach(r => { if (r.money != null) map[r.date] = r.money; });
  bonuses.forEach(b => {
    if (map[b.date] != null) map[b.date] += b.amount;
    else map[b.date] = b.amount;
  });
  return map;
}
function sumDailyIncome(filterFn) {
  const map = dailyIncomeMap();
  let sum = 0;
  Object.keys(map).forEach(date => { if (!filterFn || filterFn(date)) sum += map[date]; });
  return sum;
}
function countWorkDays(filterFn) {
  const map = dailyIncomeMap();
  let count = 0;
  Object.keys(map).forEach(date => { if (!filterFn || filterFn(date)) count++; });
  return count;
}
function getLastRecordIdPerDay() {
  const map = {};
  records.forEach(r => { if (r.out) map[r.date] = r.id; });
  return map;
}
function sumBonuses(filterFn) {
  return bonuses.reduce((s, b) => { if (!filterFn || filterFn(b.date)) return s + b.amount; return s; }, 0);
}

/* ---------- 奖赏 ---------- */
async function addBonus() {
  const v = parseFloat(document.getElementById('bonusInput').value);
  if (isNaN(v) || v <= 0) { bonusMsg('请输入有效奖赏金额', 'err'); return; }
  bonuses.push({ id: uid(), date: todayStr(), amount: Math.round(v * 10) / 10 });
  document.getElementById('bonusInput').value = '';
  saveLocal(); refresh();
  bonusMsg('✅ 已加入今日奖赏 HK$' + v, 'ok');
  if (cfg) await cloudSave();
}
async function delBonus(id) {
  if (!confirm('确定删除这个奖赏？')) return;
  bonuses = bonuses.filter(b => b.id !== id);
  if (!deletedIds.includes(id)) deletedIds.push(id);
  saveLocal(); refresh();
  if (cfg) { const ok = await cloudSave(); if (ok) msg('🗑 已删除奖赏并同步到云端', 'ok'); else msg('🗑 已删除奖赏（云端同步失败）', 'err'); }
  else msg('🗑 已删除奖赏', 'ok');
}

/* ---------- GitHub 云端同步 ---------- */
function ghHeaders() {
  return { 'Authorization': 'token ' + cfg.token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
}
function mergeRecords(localRecs, cloudRecs) {
  const map = {};
  (localRecs || []).forEach(r => { if (!deletedIds.includes(r.id)) map[r.id] = r; });
  (cloudRecs || []).forEach(r => {
    if (deletedIds.includes(r.id)) return;
    if (!map[r.id]) map[r.id] = r;
    else if ((r.out||r.in) > (map[r.id].out||map[r.id].in)) map[r.id] = r;
  });
  return Object.values(map).sort((a,b) => a.in - b.in);
}
function mergeBonuses(localBonuses, cloudBonuses) {
  const map = {};
  (localBonuses || []).forEach(b => { if (!deletedIds.includes(b.id)) map[b.id] = b; });
  (cloudBonuses || []).forEach(b => {
    if (deletedIds.includes(b.id)) return;
    if (!map[b.id]) map[b.id] = b;
  });
  return Object.values(map);
}

async function cloudLoad() {
  if (!cfg) return;
  try {
    msg('📥 正在从云端下载…', 'syncing');
    const r = await fetch('https://api.github.com/repos/' + cfg.user + '/' + cfg.repo + '/contents/data.json', { headers: ghHeaders() });
    if (r.status === 404) { cloudSha = null; msg('☁️ 云端未有资料，将会新建'); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    cloudSha = j.sha;
    const cloudData = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
    (cloudData.deletedIds || []).forEach(id => { if (!deletedIds.includes(id)) deletedIds.push(id); });
    records = mergeRecords(records, cloudData.records);
    bonuses = mergeBonuses(bonuses, cloudData.bonuses);
    if (cloudData.openRec && !deletedIds.includes(cloudData.openRec.id)) {
      if (!openRec || cloudData.openRec.in > openRec.in) openRec = cloudData.openRec;
    }
    saveLocal(); refresh();
    msg('✅ 已从云端同步 ' + records.length + ' 条记录', 'ok');
    setLastSync();
  } catch (e) { msg('⚠️ 下载失败：' + e.message, 'err'); }
}

async function cloudSave() {
  if (!cfg) { msg('未设定 GitHub（只用本机模式）'); return false; }
  if (syncing) return false;
  syncing = true;
  try {
    msg('☁️ 正在同步上云端…', 'syncing');
    const r = await fetch('https://api.github.com/repos/' + cfg.user + '/' + cfg.repo + '/contents/data.json', { headers: ghHeaders() });
    if (r.ok) {
      const j = await r.json(); cloudSha = j.sha;
      const cd = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
      (cd.deletedIds || []).forEach(id => { if (!deletedIds.includes(id)) deletedIds.push(id); });
      records = mergeRecords(records, cd.records);
      bonuses = mergeBonuses(bonuses, cd.bonuses);
    } else { cloudSha = null; }
    const payload = JSON.stringify({ records, openRec, deletedIds, bonuses });
    const body = { message: 'update clock records ' + todayStr() + ' ' + fmtTime(Date.now()), content: btoa(unescape(encodeURIComponent(payload))) };
    if (cloudSha) body.sha = cloudSha;
    const w = await fetch('https://api.github.com/repos/' + cfg.user + '/' + cfg.repo + '/contents/data.json', {
      method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body)
    });
    if (!w.ok) { const err = await w.json().catch(() => ({})); throw new Error(err.message || 'HTTP ' + w.status); }
    const wj = await w.json();
    cloudSha = wj.content.sha;
    msg('✅ 已同步到 GitHub ☁️', 'ok');
    setLastSync(); saveLocal(); refresh();
    return true;
  } catch (e) { msg('⚠️ 同步失败（已保留在本机）：' + e.message, 'err'); return false; }
  finally { syncing = false; }
}

async function forceSync() { if (!cfg) { alert('请先在下面设定 GitHub Token'); return; } await cloudSave(); }
async function syncFromCloud() { if (!cfg) { alert('请先在下面设定 GitHub Token'); return; } await cloudLoad(); }

function saveConfig() {
  const user = document.getElementById('cfgUser').value.trim();
  const repo = document.getElementById('cfgRepo').value.trim();
  const token = document.getElementById('cfgToken').value.trim();
  if (!user || !repo || !token) { alert('三项都要填！'); return; }
  cfg = { user, repo, token };
  localStorage.setItem(CFG, JSON.stringify(cfg));
  msg(''); cloudLoad().then(() => cloudSave());
}
function clearConfig() {
  cfg = null; cloudSha = null; deletedIds = []; bonuses = [];
  localStorage.removeItem(CFG); localStorage.removeItem(DELETED_KEY); localStorage.removeItem(BONUS_KEY);
  document.getElementById('cfgUser').value = '';
  document.getElementById('cfgRepo').value = '';
  document.getElementById('cfgToken').value = '';
  msg('已清除云端设定，只用本机模式');
  document.getElementById('lastSync').textContent = '';
}

/* ---------- 打卡 ---------- */
async function clockIn() {
  if (openRec) { alert('已经开工了！'); return; }
  openRec = { id: uid(), date: todayStr(), in: Date.now(), out: null, money: null };
  saveLocal(); refresh();
  if (cfg) {
    const ok = await cloudSave();
    if (ok) alert('✅ 开工打卡成功！已同步到云端\n' + fmtTime(openRec.in));
    else alert('✅ 开工打卡成功！（云端同步失败，已保留在本机）\n' + fmtTime(openRec.in));
  } else alert('✅ 开工打卡成功！' + fmtTime(openRec.in));
}

async function clockOut() {
  if (!openRec) { alert('还未开工！'); return; }
  const v = parseFloat(document.getElementById('moneyInput').value);
  if (isNaN(v) || v < 0) { alert('请输入今日累计赚了多少钱！'); return; }
  openRec.out = Date.now();
  openRec.money = Math.round(v * 10) / 10;
  records.push(openRec);
  openRec = null;
  document.getElementById('moneyInput').value = '';
  saveLocal(); refresh();
  if (cfg) {
    const ok = await cloudSave();
    if (ok) alert('✅ 收工打卡成功！已同步到云端\n今日累计赚了 HK$' + v);
    else alert('✅ 收工打卡成功！（云端同步失败，已保留在本机）\n今日累计赚了 HK$' + v);
  } else alert('✅ 收工打卡成功！今日累计赚了 HK$' + v);
}

async function delRec(i) {
  if (!confirm('确定删除这条记录？')) return;
  const id = records[i].id;
  records.splice(i, 1);
  if (!deletedIds.includes(id)) deletedIds.push(id);
  saveLocal(); refresh();
  if (cfg) { const ok = await cloudSave(); if (ok) msg('🗑 已删除并同步到云端', 'ok'); else msg('🗑 已删除（云端同步失败）', 'err'); }
  else msg('🗑 已删除', 'ok');
}

/* ---------- 导出 ---------- */
function download(name, content, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}
function exportCSV() {
  if (!records.length && !bonuses.length) { alert('还没有记录！'); return; }
  const incMap = dailyIncomeMap();
  let csv = '\ufeff日期,开工时间,收工时间,工作时数,当日总收入HK$,备注\r\n';
  records.forEach(r => {
    const lastIds = getLastRecordIdPerDay();
    const isLastOfDay = lastIds[r.date] === r.id;
    const note = isLastOfDay ? '当日最后收工' : '';
    csv += [r.date, fmtTime(r.in), r.out ? fmtTime(r.out) : '', r.out ? ((r.out-r.in)/3600000).toFixed(2) : '', r.money, note].join(',') + '\r\n';
  });
  if (bonuses.length) {
    csv += '\r\n奖赏记录\r\n日期,金额\r\n';
    bonuses.forEach(b => {
      csv += [b.date, b.amount].join(',') + '\r\n';
    });
  }
  download('keeta_' + todayStr().replace(/-/g,'') + '.csv', csv, 'text/csv;charset=utf-8');
}
function exportJSON() {
  if (!records.length && !bonuses.length) { alert('还没有记录！'); return; }
  download('keeta_' + todayStr().replace(/-/g,'') + '.json', JSON.stringify({ records, bonuses }, null, 2), 'application/json');
}

/* ---------- 显示 ---------- */
function switchTab(v, el) {
  view = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderRecords();
}
function renderRecords() {
  const box = document.getElementById('recordBox');
  if (!records.length && !bonuses.length) { box.innerHTML = '<div class="empty">还没有记录，快开工打卡吧！</div>'; return; }
  const incMap = dailyIncomeMap();
  const lastIds = getLastRecordIdPerDay();
  let html = '<table><tr><th>日期</th>' + (view==='day'?'<th>开工</th><th>收工</th><th>时数</th>':'') + '<th>收入</th><th></th></tr>';
  if (view === 'day') {
    const shownBonusDates = new Set();
    [...records].reverse().forEach(r => {
      const idx = records.indexOf(r);
      const isLastOfDay = lastIds[r.date] === r.id;
      let moneyDisplay = r.money != null ? '$' + r.money.toFixed(1) : '-';
      const calBtn = r.out ? '<a class="cal-btn" href="' + makeCalLink(r.in, r.out, r.money) + '" target="_blank">📅</a>' : '';
      const rowClass = isLastOfDay ? 'row-highlight' : '';
      html += '<tr class="' + rowClass + '"><td>' + r.date + '</td><td>' + fmtTime(r.in) + '</td><td>' + (r.out?fmtTime(r.out):'-') + '</td><td>' + (r.out?fmtDur(r.out-r.in):'-') + '</td><td class="money">' + moneyDisplay + '</td><td class="action-btns">' + calBtn + '<span class="del" onclick="delRec(' + idx + ')">✕</span></td></tr>';
      // Show bonus rows after the last record of each day
      if (isLastOfDay && !shownBonusDates.has(r.date)) {
        shownBonusDates.add(r.date);
        const dayBonuses = bonuses.filter(b => b.date === r.date);
        dayBonuses.forEach(b => {
          html += '<tr class="bonus-row"><td>' + r.date + '</td><td>-</td><td>-</td><td>-</td><td class="money">🎁 $' + b.amount.toFixed(1) + '</td><td class="action-btns"><span class="del" onclick="delBonus(\'' + b.id + '\')">✕</span></td></tr>';
        });
      }
    });
    // Also show bonus dates that have no work records
    bonuses.forEach(b => {
      if (!shownBonusDates.has(b.date)) {
        shownBonusDates.add(b.date);
        html += '<tr class="bonus-row"><td>' + b.date + '</td><td>-</td><td>-</td><td>-</td><td class="money">🎁 $' + b.amount.toFixed(1) + '</td><td class="action-btns"><span class="del" onclick="delBonus(\'' + b.id + '\')">✕</span></td></tr>';
      }
    });
  } else {
    const groups = {};
    records.forEach(r => {
      const d = new Date(r.in);
      let k;
      if (view === 'week') {
        const onejan = new Date(d.getFullYear(),0,1);
        const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
        k = d.getFullYear() + ' 第' + week + '週';
      } else {
        k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      }
      if (!groups[k]) groups[k] = { money:0, hours:0, days: new Set() };
      groups[k].days.add(r.date);
      if (r.out) groups[k].hours += (r.out - r.in) / 3600000;
    });
    const dayMap = dailyIncomeMap();
    Object.keys(dayMap).forEach(date => {
      const d = new Date(date);
      let k;
      if (view === 'week') {
        const onejan = new Date(d.getFullYear(),0,1);
        const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
        k = d.getFullYear() + ' 第' + week + '週';
      } else {
        k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      }
      if (groups[k]) groups[k].money += dayMap[date];
    });
    Object.keys(groups).sort().reverse().forEach(k => {
      const g = groups[k];
      html += '<tr><td>' + k + '</td><td>' + g.days.size + '日</td><td>' + g.hours.toFixed(1) + 'h</td><td class="money">$' + g.money.toFixed(1) + '</td><td></td></tr>';
    });
  }
  html += '</table>';
  box.innerHTML = html;
}
function refresh() {
  const st = document.getElementById('statusBox');
  const btnIn = document.getElementById('btnIn');
  const btnOut = document.getElementById('btnOut');
  if (openRec) {
    st.className = 'status on';
    st.innerHTML = '✅ 开工中<small>' + openRec.date + ' ' + fmtTime(openRec.in) + ' 开工</small>';
    btnIn.disabled = true; btnOut.disabled = false;
  } else {
    st.className = 'status off';
    st.innerHTML = '🔴 未开工<small></small>';
    btnIn.disabled = false; btnOut.disabled = true;
  }
  const hours = records.reduce((s,r) => s + (r.out ? (r.out - r.in) : 0), 0) / 3600000;
  const total = sumDailyIncome();
  const now = new Date();
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - ((now.getDay()+6)%7)); weekStart.setHours(0,0,0,0);
  const monthStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  const totalDays = countWorkDays();
  const weekIncome = sumDailyIncome(d => new Date(d) >= weekStart);
  const monthIncome = sumDailyIncome(d => d.startsWith(monthStr));
  const totalBonus = sumBonuses();
  const weekBonus = sumBonuses(d => new Date(d) >= weekStart);
  document.getElementById('stTotal').textContent = '$' + total.toFixed(1);
  document.getElementById('stDays').textContent = totalDays + '日';
  document.getElementById('stAvg').textContent = '$' + (totalDays ? (total/totalDays).toFixed(1) : 0);
  document.getElementById('stHours').textContent = hours.toFixed(1) + '小時';
  document.getElementById('stWeek').textContent = '$' + weekIncome.toFixed(1);
  document.getElementById('stMonth').textContent = '$' + monthIncome.toFixed(1);
  document.getElementById('stBonus').textContent = '$' + totalBonus.toFixed(1);
  document.getElementById('stWeekBonus').textContent = '$' + weekBonus.toFixed(1);
  renderRecords();
}

/* ---------- 背景自动同步 ---------- */
setInterval(() => { if (cfg && !syncing && !openRec) cloudSave(); }, 60000);
if (document.visibilityState !== undefined) {
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && cfg) { cloudLoad().then(() => { if (!openRec) cloudSave(); }); }
  });
}

/* ---------- 启动 ---------- */
if (cfg) {
  document.getElementById('cfgUser').value = cfg.user;
  document.getElementById('cfgRepo').value = cfg.repo;
  document.getElementById('cfgToken').value = cfg.token;
  cloudLoad().then(() => { if (!openRec) cloudSave(); });
}
refresh();
</script>
